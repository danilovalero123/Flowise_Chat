<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Asistente Virtual</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
        }

        body {
            display: flex;
            background-color: #CFCFCF;
            color: #4D5057;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 18px;
            line-height: 1.6;
        }

        /* ═══════════════ COLUMNA IZQUIERDA: CHAT ═══════════════ */
        .chat-column {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 20px 20px 20px 24px;
        }

        .main-container {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background-color: #FFFFFF;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        flowise-fullchatbot {
            display: block;
            width: 100%;
            height: 100%;
            flex: 1;
            min-height: 0;
        }

        /* ── Error de conexión ── */
        .connection-error {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 40px;
            text-align: center;
            color: #4D5057;
            height: 100%;
        }

        .connection-error.visible {
            display: flex;
        }

        .connection-error .error-icon {
            font-size: 48px;
        }

        .connection-error .error-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #4D5057;
        }

        .connection-error .error-msg {
            font-size: 1rem;
            color: #666;
        }

        .connection-error .error-hint {
            font-size: 0.9rem;
            color: #999;
            background: #F5F5F5;
            padding: 12px 20px;
            border-radius: 10px;
        }

        /* ═══════════════ COLUMNA DERECHA: IMAGEN + CITA ═══════════════ */
        .image-column {
            flex: 0 0 420px;
            min-width: 320px;
            background-color: #4E6E5D;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 28px;
        }

        .image-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 450px;
        }

        .shopkeeper-photo {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: block;
        }

        .quote {
            color: #FFFFFF;
            font-size: 1.15rem;
            font-weight: 300;
            font-style: italic;
            line-height: 1.5;
            text-align: center;
        }

        /* ═══════════════ SCROLLBAR ═══════════════ */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #E0E0E0;
        }
        ::-webkit-scrollbar-thumb {
            background: #4D5057;
            border-radius: 4px;
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: #4D5057 #E0E0E0;
        }

        /* ── Ocultar branding ── */
        flowise-fullchatbot::part(footer),
        flowise-fullchatbot::part(branding),
        flowise-fullchatbot::part(powered-by),
        flowise-fullchatbot::part(poweredBy) {
            display: none !important;
        }

        /* ═══════════════ RESPONSIVE ═══════════════ */
        @media (max-width: 860px) {
            body {
                flex-direction: column;
            }

            .chat-column {
                flex: 1;
                min-height: 0;
                padding: 12px 12px 12px 12px;
            }

            .image-column {
                flex: 0 0 auto;
                min-width: 100%;
                padding: 24px 20px;
            }

            .image-content {
                flex-direction: row;
                align-items: center;
                gap: 20px;
                max-width: 100%;
            }

            .shopkeeper-photo {
                width: 100px;
                aspect-ratio: 4/5;
                border-radius: 12px;
                flex-shrink: 0;
            }

            .quote {
                font-size: 1rem;
                text-align: left;
            }
        }

        @media (max-width: 480px) {
            .image-column {
                padding: 16px 16px;
            }

            .shopkeeper-photo {
                width: 80px;
            }

            .quote {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- ═══════════ COLUMNA IZQUIERDA: CHAT ═══════════ -->
    <div class="chat-column">
        <div class="main-container">
            <flowise-fullchatbot id="flowise-widget"></flowise-fullchatbot>
            <div class="connection-error" id="connection-error">
                <span class="error-icon">&#9888;</span>
                <p class="error-title">No se pudo conectar al asistente</p>
                <p class="error-msg">El servidor de Flowise no está disponible en este momento.</p>
                <p class="error-hint">Verifique que el servicio esté corriendo en <strong>http://localhost:3000</strong></p>
            </div>
        </div>
    </div>

    <!-- ═══════════ COLUMNA DERECHA: IMAGEN + CITA ═══════════ -->
    <div class="image-column">
        <div class="image-content">
            <img
                class="shopkeeper-photo"
                src="https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=480&h=600&q=80"
                alt="Tendero de barrio sonriente detr&aacute;s del mostrador"
            />
            <p class="quote">"La cercan&iacute;a de un buen tendero<br>no tiene comparaci&oacute;n."</p>
        </div>
    </div>

    <script type="module">
        import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js"

        const chatflowid = "cc1a11c4-eefe-4e32-8eea-916dcf1fb6fb"
        const apiHost = "http://localhost:3000"

        let initFailed = false

        try {
            Chatbot.initFull({
                chatflowid,
                apiHost,
                theme: {
                    chatWindow: {
                        showTitle: true,
                        title: "Asistente Virtual",
                        backgroundColor: "#FFFFFF",
                        welcomeMessage: "¡Hola! Soy su asistente. ¿En qué puedo ayudarle hoy con su negocio?",
                        botMessage: {
                            backgroundColor: "#4E6E5D",
                            textColor: "#FFFFFF"
                        },
                        userMessage: {
                            backgroundColor: "#4DA167",
                            textColor: "#FFFFFF"
                        },
                        textInput: {
                            backgroundColor: "#FFFFFF",
                            textColor: "#4D5057",
                            sendButtonColor: "#3BC14A",
                            placeholder: "Escriba su consulta aquí..."
                        }
                    }
                }
            })
        } catch (e) {
            console.error("Flowise initFull error:", e)
            initFailed = true
            showConnectionError()
        }

        function showConnectionError() {
            const widget = document.getElementById("flowise-widget")
            const errorEl = document.getElementById("connection-error")
            if (widget) widget.style.display = "none"
            if (errorEl) errorEl.classList.add("visible")
        }

        /* Detecta errores de red durante el uso */
        window.addEventListener("unhandledrejection", (event) => {
            if (event.reason && event.reason.message && event.reason.message.includes("fetch")) {
                console.error("Flowise fetch error:", event.reason)
                showConnectionError()
            }
        })

        /* ── Inyecta estilos en el shadow DOM ── */
        customElements.whenDefined("flowise-fullchatbot").then(() => {
            const widget = document.getElementById("flowise-widget")
            if (!widget) return

            const inject = () => {
                if (!widget.shadowRoot) {
                    requestAnimationFrame(inject)
                    return
                }
                const style = document.createElement("style")
                style.textContent = `
                    * {
                        font-size: 18px !important;
                        line-height: 1.6 !important;
                    }

                    /* Scrollbar */
                    ::-webkit-scrollbar { width: 8px; }
                    ::-webkit-scrollbar-track { background: #E0E0E0; }
                    ::-webkit-scrollbar-thumb { background: #4D5057; border-radius: 4px; }
                    * { scrollbar-width: thin; scrollbar-color: #4D5057 #E0E0E0; }

                    /* Cabecera: Charcoal con texto blanco */
                    [class*="header"],
                    [class*="title"],
                    [class*="chat-header"],
                    [class*="top-bar"] {
                        background-color: #4D5057 !important;
                        color: #FFFFFF !important;
                        padding: 14px 20px !important;
                    }

                    [class*="header"] *,
                    [class*="title"] *,
                    [class*="chat-header"] * {
                        color: #FFFFFF !important;
                    }

                    /* Botón de refrescar: visible y con buen contraste */
                    [class*="refresh"],
                    [class*="restart"],
                    [class*="reset"],
                    button[class*="refresh"],
                    button[class*="restart"] {
                        background-color: rgba(255,255,255,0.15) !important;
                        border-radius: 8px !important;
                        padding: 6px 10px !important;
                        cursor: pointer !important;
                    }

                    [class*="refresh"]:hover,
                    [class*="restart"]:hover {
                        background-color: rgba(255,255,255,0.25) !important;
                    }

                    [class*="refresh"] svg,
                    [class*="restart"] svg,
                    [class*="refresh"] path,
                    [class*="restart"] path {
                        fill: #FFFFFF !important;
                        stroke: #FFFFFF !important;
                    }

                    /* Burbujas: redondeadas + sombra suave */
                    [class*="message"],
                    [class*="bubble"],
                    [class*="chat-message"] {
                        border-radius: 18px !important;
                        box-shadow: 0 2px 8px rgba(0,0,0,0.1) !important;
                        padding: 14px 20px !important;
                    }

                    /* Input: blanco + borde Charcoal 2px */
                    [class*="input"],
                    [class*="textInput"],
                    [class*="chat-input"],
                    input[type="text"],
                    textarea {
                        background-color: #FFFFFF !important;
                        border: 2px solid #4D5057 !important;
                        border-radius: 14px !important;
                        font-size: 18px !important;
                        padding: 14px 18px !important;
                        color: #4D5057 !important;
                    }

                    [class*="input"]:focus-within,
                    input[type="text"]:focus,
                    textarea:focus {
                        border-color: #3BC14A !important;
                        outline: none !important;
                    }

                    /* Botón enviar: Jade Green grande */
                    [class*="send"],
                    [class*="sendButton"],
                    button[class*="send"],
                    [class*="chat-input"] button {
                        background-color: #3BC14A !important;
                        border-radius: 14px !important;
                        padding: 14px 20px !important;
                        min-width: 56px !important;
                        min-height: 56px !important;
                        border: none !important;
                        cursor: pointer !important;
                        display: flex !important;
                        align-items: center !important;
                        justify-content: center !important;
                    }

                    [class*="send"]:hover,
                    button[class*="send"]:hover {
                        background-color: #2E9E3E !important;
                    }

                    /* Icono flecha: blanco puro y grande */
                    button svg,
                    button svg *,
                    [class*="send"] svg,
                    [class*="send"] svg *,
                    button path,
                    button line,
                    button polygon,
                    button circle,
                    button rect,
                    [class*="send"] path,
                    [class*="send"] line,
                    [class*="send"] polygon,
                    [class*="send"] circle,
                    [class*="send"] rect {
                        fill: #FFFFFF !important;
                        stroke: #FFFFFF !important;
                    }

                    button svg,
                    [class*="send"] svg {
                        width: 24px !important;
                        height: 24px !important;
                    }

                    /* Ocultar branding */
                    [class*="powered"],
                    [class*="footer"],
                    [class*="branding"],
                    [id*="powered"],
                    [id*="footer"],
                    [id*="branding"] {
                        display: none !important;
                    }

                    /* Área de mensajes */
                    [class*="messages"],
                    [class*="chat-messages"],
                    [class*="conversation"] {
                        background-color: #FAFAFA !important;
                        padding: 16px !important;
                    }
                `
                widget.shadowRoot.prepend(style)
            }
            requestAnimationFrame(inject)
        })
    </script>
</body>
</html>
